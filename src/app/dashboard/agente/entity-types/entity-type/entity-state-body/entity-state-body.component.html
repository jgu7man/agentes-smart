<div id="tipo-body" *ngIf="entity">

  <!-- OPCIONES DE ENTIDAD -->
  <div class="row">
    <div class="col s12" id="tipo-options">
      <!-- <mat-checkbox
        [color]="'primary'"
        (change)="onKindChange($event)"
        [checked]="entity.kind == 'KIND_MAP'"
      >
        Activar sinónimos
      </mat-checkbox> -->

      <mat-checkbox
        [color]="'primary'"
        (change)="onExpantionChange($event)"
        [checked]="entity.autoExpansionMode == 'AUTO_EXPANSION_MODE_DEFAULT'"
      >
        Auto expansión
      </mat-checkbox>

      <mat-checkbox
        [color]="'primary'"
        (change)="onFuzzyChange($event)"
        [checked]="entity.enableFuzzyExtraction"
      >
        Activar coincidencia parcial
      </mat-checkbox>
    </div>
  </div>


  <!-- CLASES CRUD -->
  <div class="row">
    <div class="col s12">
      <h4>Clases del tipo de dato</h4>

      <!-- Clases con sinónimos -->
      <mat-card >
        <mat-card-content>


          <!-- Table head -->
          <div class="row" id="clases-header">
            <div class="col s3"><b>Parámetro</b></div>
            <div class="col s9"><b>Sinónimos</b></div>
          </div>

          <mat-divider></mat-divider>


          <!-- READ lista CLASES DE TIPO -->
          <ul class="clase-list collection">
            <li
              class="clase-item collection-item"
              *ngFor="let clase of entity.entities; index as i"
            >


            <!-- UPDATE CLASE  -->
              <div class="row">
                <as-entity [claseId]="clase.value"></as-entity>
              </div>
              <mat-divider></mat-divider>
            </li>

            <mat-divider></mat-divider>

            <!-- CREATE CLASE DE TIPO -->
            <ng-template #addClase>
              <li
                class="clase-item"
                [ngClass]="{ 'collection-item': entity_.switchAddClase }"
              >
                <div class="row">
                  <as-entity></as-entity>
                </div>
                <mat-divider></mat-divider>
              </li>
            </ng-template>
          </ul>

          <!-- TO CREATE -->
          <ng-container *ngIf="!entity_.switchAddClase; else addClase">
            <button
              mat-raised-button
              color="primary"
              (click)="onAddClase()"
              [disabled]="!entity.name"
            >
              Agregar parámetro
            </button>
          </ng-container>
        </mat-card-content>
      </mat-card>
      <!-- !## Clases con sinónimos -->


    </div>
  </div>
  <!-- !## CLASES CRUD -->
</div>
