<mat-form-field appearance="outline">
  <mat-label>Nombre del contexto</mat-label>
  <input
    matInput
    required
    type="text"
    name="contextoNuevo"
    [formControl]="contextNameCtrl"
    (keypress)="text.onlyAllow(['letters', 'backspace'], $event)"
    (keyup.enter)="onSetContext()"
  >
  <mat-error *ngIf="contextNameCtrl.hasError('required')">
  Este dato es necesario
  </mat-error>
</mat-form-field>
