<div class="container" *ngIf="entityType">
  <!-- Tipo body to update -->
  <div class="row">
    <div class="col s12">
      <mat-card>
        <mat-card-content>
          <as-entity-state-body [entity]="entityType"></as-entity-state-body>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <!-- Guardar el tipo -->
  <div class="row">
    <div class="col s12">
      <div class="col s2">
        <button
          mat-raised-button
          [color]="'primary'"
          (click)="onSave()"
          [disabled]="entityType.entities.length == 0"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
