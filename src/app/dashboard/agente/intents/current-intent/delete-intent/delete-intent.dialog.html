<div mat-dialog-content>
  <p class="center">¿Realemente deseas eliminar esta interacción?</p>
</div>
<mat-dialog-actions style="display: flex; justify-content: space-around;">
  <button
  mat-raised-button
  (click)="dialog.close()"
  >Cancelar</button>
  <button
  mat-raised-button
  (click)="intents.delete(intentName)"
  [mat-dialog-close]="true"
  color="primary"
  >Aceptar</button>
</mat-dialog-actions>
