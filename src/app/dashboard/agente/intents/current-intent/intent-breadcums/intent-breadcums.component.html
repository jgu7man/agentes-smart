<p id="breadcums" *ngIf="context">
  <!-- CONTEXTO -->
  <a [routerLink]="['../../flujo']"  ><span><b>{{context}}: </b></span></a>
  <!-- ENTRADAS -->
  <span *ngFor="let intent of mensajes | slice:0:intentIndex +1; index as i">
      <a [routerLink]="['../../interaccion',intent.name]"
      [queryParams]="{'contexto': context}">
      {{intent.displayName}}
  </a>
  <span *ngIf="i != mensajes.length -1"> > </span>
</span>
</p>
