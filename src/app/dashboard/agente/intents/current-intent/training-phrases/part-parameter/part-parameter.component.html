<div class="row param-row" *ngIf="part.alias && part.alias != ''">

  <!-- HEADER -->
  <!-- Texto seleccionado -->
  <div class="col l10">
    <p>"<b>{{part.text}}</b>"
      <mat-divider [inset]="true"></mat-divider>
    </p>
  </div>

  <!-- Eliminar parametro -->
  <div class="col l2 paramOptions right">
    <button mat-icon-button (click)="onDelete.emit()">
      <i class="fas fa-times red-text"></i>
      <!-- Eliminar -->
    </button>
    <button mat-icon-button (click)="_frases.paramAdded$.next()">
      <i class="fas fa-check green-text"></i>
      <!-- Guardar -->
    </button>
  </div>


  <!-- BODY -->
  <div class="col s12">

    <!-- TIPO DE DATO -->
    <div class="row">
      <!-- Tipo de dato -->
      <div class="col s6">
        <as-entity-type-selector
          (tipoSelected)="onEntityTypeSelected($event)"
          [value]="part.entityType"
        ></as-entity-type-selector>
      </div>

      <div class="col s6">
        <button mat-raised-button (click)="onAddEntityType()">
          Crear nuevo contexto
        </button>
      </div>
    </div>


    <!-- PARÁMETRO -->
    <div class="row">
      <!-- Nombre param -->
      <div class="col s6">
        <!-- Define entity and param -->
        <ng-container *ngIf="!isSystemEntity; else customParam">
          <!-- Add new entity at entityType -->
          <ng-container *ngIf="allowAddEntity; else selectEntity">
            <mat-form-field appearance="outline" floatLabel="always">
              <mat-label>Nombre Parámetro</mat-label>
              <input
                placeholder="Lo que quiso decir..."
                matInput
                type="text"
                [formControl]="paramNameCtrl"
                name="paramName"
              />
            </mat-form-field>
          </ng-container>
          <!-- Select entityType -->
          <ng-template #selectEntity >
            <as-entity-value-selector
            [entityTypeDisplayName]="part.entityType || ''"
            [value]="part.alias"
            (selected)="onEntitySelect($event)"
            ></as-entity-value-selector>
          </ng-template>
        </ng-container>
        <!-- Defines CUSTOM PARAM -->
        <ng-template #customParam >
          <mat-form-field appearance="outline">
            <mat-label>Parámetro Personalizado</mat-label>
            <input
              placeholder="Nombre del parámetro"
              matInput
              type="text"
              [formControl]="paramNameCtrl"
              (keypress)="text.onlyAllow(['letters', 'backspace'], $event)"
              name="paramName"
            />
          </mat-form-field>
        </ng-template>

      </div>


      <div class="col s6" *ngIf="!isSystemEntity; else add" >
        <ng-container *ngIf="!allowAddEntity; else add">
          <button mat-raised-button
          (click)="allowAddEntity = true" >
            Agregar parámetro
          </button>
        </ng-container>
      </div>
      <ng-template #add >
        <button mat-raised-button
        (click)="setNewEntity()">Agregar</button>
      </ng-template>
    </div>


    <!-- VALOR -->
    <div class="row">
      <!-- Valor -->
    <div class="col s6">
      <mat-form-field appearance="outline">
        <mat-label>Valor</mat-label>
        <input matInput type="text" [(ngModel)]="part.text" readonly disabled
        placeholder="Lo que dijo..."
        />
      </mat-form-field>
    </div>

    <div class="col s6" *ngIf="!isSystemEntity">
      <button mat-raised-button
      (click)="setSinonimo()"
      [disabled]="synonymStored !== undefined "
      [matTooltip]="addSynonymToolTip "
      >Agregar como sinónimo</button>
    </div>
    </div>





  </div>


</div>
