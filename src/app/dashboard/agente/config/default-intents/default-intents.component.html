<mat-card>
  <h5>DEFULT INTENTS</h5>
  <mat-divider></mat-divider>
  <div class="row">
    <div class="col s12">
      <button mat-button (click)="openConfigFallback()">
        Configurar Retroceso
      </button>
    </div>
    <div class="col s12">
      <button
        mat-button
        (click)="opciones_.restoreDefaultIntent('Default Welcome Intent')"
      >
        Restaurar intent de Bienvenida
      </button>
    </div>
    <div class="col s12">
      <button
        mat-button
        (click)="opciones_.restoreDefaultIntent('Default Context Intent')"
      >
        Restaurar intent de Contextos
      </button>
    </div>
    <div class="col s12">
      <button
        mat-button
        (click)="opciones_.restoreDefaultIntent('Default Fallback Intent')"
      >
        Restaurar intent de Retroceso
      </button>
    </div>
  </div>
  <mat-divider></mat-divider>
  <div class="row"></div>
</mat-card>
