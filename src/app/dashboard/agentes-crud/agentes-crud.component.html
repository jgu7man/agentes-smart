<div id="agents-container" class="row" *>
  <!-- ## Si hay agents -->
  <ng-container *ngIf="agentList.length > 0; else noAgents">
    <div class="col s12 m6 l4 agent-box" *ngFor="let agent of agentList">
      <!-- # Tarjeta de agent -->
      <mat-card>
        <mat-card-header>
          <!-- # Icono del agent -->
          <div
            mat-card-avatar
            class="avatar-img"
            [ngStyle]="{
              'background-image': 'url(' + agent.avatarUri.url + ')'
            }"
            [routerLink]="['/dashboard/agente', agent.projectId]"
          ></div>

          <!-- Nombre del agente -->
          <mat-card-title
            [routerLink]="['/dashboard/agente', agent.projectId]"
            >{{ agent.displayName }}
          </mat-card-title>

          <!-- Descripción -->

          <!-- Opciones -->
          <button class="card-menu" mat-button [matMenuTriggerFor]="menu">
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <mat-menu #menu="matMenu">
            <button
            mat-menu-item
            [routerLink]="['/dashboard/editar_agente', agent.projectId]"
            >
              Editar
            </button>
            <button mat-menu-item (click)="deleteAgent(agent.projectId)">
              Eliminar
            </button>
          </mat-menu>
        </mat-card-header>
        <mat-card-content>
          <mat-card-subtitle> {{ agent.description }} </mat-card-subtitle>

        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>

  <!-- Si no hay agents -->
  <ng-template #noAgents>
    <div class="col s12 center">
      <p class="center grey-text">Aún no tienes agents creados.</p>
      <i class="fas fa-robot fa-10x grey-text"></i>
      <p>Crea una agente para empezar a programarlo</p>
      <button
        mat-raised-button
        color="primary"
        [routerLink]="['/dashboard/crear_agente']"
      >
        Crear agente
      </button>
    </div>
  </ng-template>
</div>
